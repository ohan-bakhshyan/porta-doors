<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTA — Architectural Admin Gate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/variables.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-surface);
      color: var(--color-on-surface);
      padding: 24px;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      background: var(--color-surface-lowest);
      border: 1px solid var(--color-surface-container);
      padding: 48px 40px;
      box-shadow: var(--shadow-md);
    }
    .brand-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .portal-icon {
      width: 28px;
      height: 38px;
      border: 2px solid var(--color-primary);
      position: relative;
    }
    .portal-icon::after {
      content: '';
      position: absolute;
      right: 3px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 3px;
      background: var(--color-primary);
      border-radius: 50%;
    }
    .brand-text {
      font-family: var(--font-headline);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-primary);
    }
    .brand-sub {
      font-family: var(--font-label);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-secondary);
      margin-top: 2px;
    }
    h1 {
      font-family: var(--font-headline);
      font-size: 24px;
      font-weight: 400;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    p.desc {
      font-size: 13px;
      color: var(--color-secondary);
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-family: var(--font-label);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--color-secondary);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      font-family: var(--font-body);
      font-size: 14px;
      background-color: var(--color-surface-low);
      border: 1px solid var(--color-surface-container);
      color: var(--color-on-surface);
      outline: none;
      transition: border-color var(--transition-fast);
    }
    input:focus {
      border-color: var(--color-primary);
      background-color: var(--color-surface-lowest);
    }
    .btn-login {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      background: var(--color-primary);
      color: var(--color-on-primary);
      font-family: var(--font-label);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: background var(--transition-fast), color var(--transition-fast);
    }
    .btn-login:hover {
      background: var(--color-surface-high);
      color: var(--color-primary);
    }
    .alert-error {
      background: #fff0f0;
      border: 1px solid #ffc8c8;
      color: #93000a;
      padding: 10px 14px;
      font-size: 12px;
      margin-bottom: 20px;
      display: none;
    }
    .seed-hint {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--color-surface-container);
      font-size: 11px;
      color: var(--color-secondary);
      font-family: var(--font-mono);
      line-height: 1.6;
    }
    .seed-hint code {
      color: var(--color-primary);
      font-weight: 600;
    }
    .back-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      font-family: var(--font-label);
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--color-secondary);
    }
    .back-link:hover {
      color: var(--color-primary);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-mark">
      <div class="portal-icon"></div>
      <div>
        <div class="brand-text">PORTA</div>
        <div class="brand-sub">Architectural Specification CMS</div>
      </div>
    </div>

    <h1>Showroom Access</h1>
    <p class="desc">Authenticate to manage architectural doors, systems, global brand partners, promotional pricing, and specifications.</p>

    <div class="alert-error" id="error-box"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Admin Username</label>
        <input type="text" id="username" required autocomplete="username" value="admin">
      </div>

      <div class="form-group">
        <label for="password">Security Password</label>
        <input type="password" id="password" required autocomplete="current-password" value="admin">
      </div>

      <button type="submit" class="btn-login" id="submit-btn">Enter Portal Control</button>
    </form>

    <div class="seed-hint">
      <strong>Showroom Access Directive:</strong><br>
      Default Username: <code>admin</code><br>
      Default Password: <code>admin</code>
    </div>

    <a href="../front/index.html" class="back-link">← Return to Public Showroom</a>
  </div>

  <script type="module">
    import { store } from '../shared/js/store.js';

    // If already authenticated, redirect straight to admin
    const session = store.getCurrentSession();
    if (session) {
      window.location.replace('index.html');
    }

    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      const res = store.authenticate(username, password);
      if (res.success) {
        window.location.replace('index.html');
      } else {
        errorBox.textContent = res.error || 'Authentication rejected.';
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
