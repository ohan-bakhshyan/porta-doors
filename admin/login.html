<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOORS GALLERY — Admin Sign-In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/variables.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-surface-low);
      color: var(--color-on-surface);
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border: 1px solid var(--color-outline-variant);
      border-top: 3px solid var(--color-gold);
      padding: 36px 32px;
      box-shadow: var(--shadow-md);
    }
    .brand-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }
    .brand-mark img {
      height: 38px;
      width: auto;
      object-fit: contain;
    }
    .brand-text {
      font-family: var(--font-headline);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-primary);
    }
    .brand-sub {
      font-family: var(--font-label);
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-gold-dark);
      margin-top: 2px;
    }
    h1 {
      font-family: var(--font-headline);
      font-size: 20px;
      font-weight: 500;
      text-transform: uppercase;
      color: var(--color-primary);
      margin-bottom: 6px;
    }
    p.desc {
      font-size: 12px;
      color: var(--color-on-surface-variant);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-family: var(--font-label);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--color-secondary);
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      font-family: var(--font-body);
      font-size: 13px;
      background-color: var(--color-surface-low);
      border: 1px solid var(--color-outline-variant);
      color: var(--color-on-surface);
      outline: none;
      transition: border-color var(--transition-fast);
    }
    input:focus {
      border-color: var(--color-gold);
      background-color: #ffffff;
    }
    .btn-login {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      background: var(--color-primary);
      color: var(--color-gold-light);
      border: 1px solid var(--color-primary);
      font-family: var(--font-label);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: all var(--transition-fast);
    }
    .btn-login:hover {
      background: var(--color-gold);
      border-color: var(--color-gold);
      color: #ffffff;
    }
    .alert-error {
      background: #fff5f5;
      border: 1px solid #feb2b2;
      color: #9b2c2c;
      padding: 9px 12px;
      font-size: 12px;
      margin-bottom: 16px;
      display: none;
    }
    .seed-hint {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--color-outline-variant);
      font-size: 11px;
      color: var(--color-secondary);
      font-family: var(--font-mono);
      line-height: 1.6;
    }
    .seed-hint code {
      color: var(--color-gold-dark);
      font-weight: 600;
    }
    .back-link {
      display: block;
      margin-top: 16px;
      text-align: center;
      font-family: var(--font-label);
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--color-secondary);
    }
    .back-link:hover {
      color: var(--color-gold-dark);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="brand-mark">
      <img src="../shared/assets/logo-mark.png" alt="Doors Gallery">
      <div>
        <div class="brand-text">DOORS GALLERY</div>
        <div class="brand-sub">Showroom Administration</div>
      </div>
    </div>

    <h1>Admin Sign-In</h1>
    <p class="desc">Sign in to manage rotating banners, categories, door models, promotional offers, and customer inquiries.</p>

    <div class="alert-error" id="error-box"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required autocomplete="username" value="admin">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" value="admin">
      </div>

      <button type="submit" class="btn-login" id="submit-btn">Enter Admin Panel</button>
    </form>

    <div class="seed-hint">
      Default Credentials: <code>admin</code> / <code>admin</code>
    </div>

    <a href="../front/index.html" class="back-link">← Return to Showroom</a>
  </div>

  <script type="module">
    import { store } from '../shared/js/store.js';

    const session = store.getCurrentSession();
    if (session) {
      window.location.replace('index.html');
    }

    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const res = store.authenticate(username, password);
      if (res.success) {
        window.location.replace('index.html');
      } else {
        errorBox.textContent = res.error || 'Invalid credentials.';
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
