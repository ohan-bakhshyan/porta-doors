<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>PORTA — Architectural Brand Partner Profile</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <style>
    @layer base {
      html, body { margin:0; padding:0; }
    }
    ::-webkit-scrollbar { display:none; }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "surface": "#f9f9f8",
            "surface-low": "#f3f4f3",
            "surface-container": "#eeeeed",
            "surface-container-high": "#e8e8e7",
            "surface-container-lowest": "#ffffff",
            "on-surface": "#1a1c1c",
            "on-surface-variant": "#444748",
            "primary": "#000000",
            "on-primary": "#ffffff",
            "secondary": "#5e5e5e"
          },
          fontFamily: {
            "headline-lg": ["Space Grotesk", "sans-serif"],
            "headline-md": ["Space Grotesk", "sans-serif"],
            "label-lg": ["Space Grotesk", "sans-serif"],
            "label-md": ["Space Grotesk", "sans-serif"],
            "label-sm": ["Space Grotesk", "sans-serif"],
            "body-md": ["Inter", "sans-serif"],
            "body-sm": ["Inter", "sans-serif"]
          },
          spacing: {
            "margin": "2.5rem",
            "gutter": "1.5rem"
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased">

  <!-- HEADER -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-surface/90 backdrop-blur-md shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
    <div class="h-20 w-full px-margin flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="index.html" class="flex items-center gap-3">
          <div class="w-6 h-8 border-2 border-primary relative">
            <span class="absolute right-1 top-1/2 -translate-y-1/2 w-1 h-1 bg-primary rounded-full"></span>
          </div>
          <span class="font-headline-md tracking-tight text-primary uppercase font-medium">PORTA</span>
        </a>
        <span class="text-secondary font-label-sm text-xs uppercase tracking-widest pl-2 border-l border-surface-container">Brand Dossier</span>
      </div>

      <nav class="hidden xl:flex items-center gap-8">
        <a class="font-label-lg text-xs uppercase text-on-surface-variant hover:text-on-surface transition-colors tracking-widest" href="catalog.html">All Collections</a>
        <a class="font-label-lg text-xs uppercase text-on-surface-variant hover:text-on-surface transition-colors tracking-widest" href="index.html#systems">8 Door Systems</a>
        <a class="font-label-lg text-xs uppercase text-on-surface-variant hover:text-on-surface transition-colors tracking-widest" href="index.html#inquiry">Trade Inquiry</a>
      </nav>

      <div class="flex items-center gap-4">
        <a href="catalog.html" class="inline-flex items-center justify-center bg-primary text-on-primary font-label-md text-xs uppercase px-4 py-2 hover:bg-surface-container-high hover:text-primary transition-colors tracking-widest">
          Explore Catalog
        </a>
      </div>
    </div>
  </header>

  <main class="w-full pt-20">
    <!-- Brand Hero Banner -->
    <div class="relative w-full h-[380px] bg-surface-container overflow-hidden">
      <img id="brand-banner" class="w-full h-full object-cover grayscale-[20%]" src="" alt="Brand Banner"/>
      <div class="absolute inset-0 bg-primary/30"></div>
      <div class="absolute bottom-10 left-margin right-margin text-on-primary">
        <span class="font-label-sm text-xs uppercase tracking-[0.25em] text-surface-container" id="brand-country">Germany</span>
        <h1 class="font-headline-lg text-3xl lg:text-5xl uppercase tracking-tight mt-1" id="brand-name">Partner Brand</h1>
      </div>
    </div>

    <!-- Editorial Bio -->
    <div class="px-margin py-12 max-w-4xl">
      <span class="font-label-sm text-xs uppercase tracking-widest text-secondary">Architectural Practice & Manufacturing Standard</span>
      <p class="font-body-md text-base text-on-surface-variant mt-3 leading-relaxed" id="brand-bio"></p>
    </div>

    <!-- Brand Doors Grid -->
    <div class="px-margin pb-24">
      <div class="border-t border-surface-container pt-8 mb-8 flex items-baseline justify-between">
        <h2 class="font-headline-md text-xl uppercase text-primary">Catalog Models by This Brand</h2>
        <span class="font-label-sm text-xs uppercase text-secondary" id="brand-doors-count">0 models</span>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-gutter" id="brand-doors-grid"></div>
    </div>
  </main>

  <script type="module">
    import { store } from '../shared/js/store.js';
    import { Utils } from '../shared/js/utils.js';

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');

      const brands = store.getBrands();
      const brand = brands.find(b => b.slug === slug) || brands[0];

      if (!brand) {
        document.getElementById('brand-name').textContent = 'Brand Not Found';
        return;
      }

      document.getElementById('brand-name').textContent = brand.name;
      document.getElementById('brand-country').textContent = `Origin / ${brand.originCountry}`;
      document.getElementById('brand-bio').textContent = brand.bio || 'Precision engineering and planar architectural perfection.';
      document.getElementById('brand-banner').src = brand.heroBanner || 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=80';

      const doors = store.getDoors({ isActive: true }).filter(d => d.brandId === brand.id);
      document.getElementById('brand-doors-count').textContent = `${doors.length} model(s)`;

      const grid = document.getElementById('brand-doors-grid');
      if (doors.length === 0) {
        grid.innerHTML = '<div class="col-span-full p-8 text-secondary font-label-sm text-xs uppercase">No active doors currently listed under this brand.</div>';
        return;
      }

      grid.innerHTML = doors.map(door => {
        const priceInfo = store.calculateEffectivePrice(door);
        const primaryImg = (door.images || []).find(i => i.isPrimary)?.url || door.images?.[0]?.url || Utils.getArchitecturalPlaceholderSvg();

        return `
          <article class="bg-surface-container-lowest border border-surface-container flex flex-col shadow-sm">
            <div class="aspect-[3/4] overflow-hidden bg-surface-container">
              <img src="${primaryImg}" class="w-full h-full object-cover" alt="${Utils.escapeHtml(door.name)}"/>
            </div>
            <div class="p-5 flex flex-col justify-between flex-grow">
              <div>
                <span class="font-label-sm text-[10px] text-secondary uppercase">${door.sku}</span>
                <h3 class="font-headline-md text-base uppercase text-primary mt-1">${Utils.escapeHtml(door.name)}</h3>
                <p class="font-body-sm text-xs text-on-surface-variant mt-2 line-clamp-2">${Utils.escapeHtml(door.shortDescription || '')}</p>
                <div class="mt-4 font-label-md text-xs font-bold text-primary">${Utils.formatCurrency(priceInfo.effectivePrice)}</div>
              </div>
              <div class="mt-4 pt-3 border-t border-surface-container">
                <a href="catalog.html?brand=${brand.slug}" class="w-full text-center block bg-primary text-on-primary font-label-md text-[10px] uppercase tracking-widest py-2.5">
                  View in Catalog
                </a>
              </div>
            </div>
          </article>
        `;
      }).join('');
    });
  </script>
</body>
</html>
