<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>DOORS GALLERY — Partner Brand Profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link rel="stylesheet" href="../shared/css/variables.css"/>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "surface": "#ffffff",
            "surface-low": "#f8f8f6",
            "surface-container": "#f1f0ec",
            "on-surface": "#26282a",
            "on-surface-variant": "#5c6066",
            "secondary": "#6e7278",
            "ink": "#141414",
            "gold": "#b8922a",
            "gold-dark": "#96751d",
            "gold-light": "#e5c76b",
            "gold-tint": "#fbf8ef",
            "hairline": "#e5e3dc"
          },
          fontFamily: {
            "headline": ["Space Grotesk", "sans-serif"],
            "label": ["Space Grotesk", "sans-serif"],
            "body": ["Inter", "sans-serif"]
          },
          maxWidth: { "fhd": "1240px" }
        }
      }
    };
  </script>
</head>
<body class="bg-surface font-body text-[14px] text-on-surface antialiased">

  <header class="sticky top-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-md border-b border-hairline">
    <div class="max-w-fhd mx-auto px-4 sm:px-6 h-14 sm:h-16 flex items-center justify-between gap-3">
      <a href="index.html" class="flex items-center gap-2.5">
        <img id="header-logo-img" src="../shared/assets/logo-mark.png" alt="Doors Gallery" class="h-8 sm:h-9 w-auto object-contain"/>
        <span class="font-headline text-sm sm:text-[15px] font-semibold tracking-[0.14em] text-ink uppercase" id="header-brand-title">DOORS GALLERY</span>
      </a>

      <nav class="hidden md:flex items-center gap-6">
        <a href="index.html" class="font-label text-[11px] uppercase tracking-[0.14em] text-on-surface-variant hover:text-gold-dark">Home</a>
        <a href="catalog.html" class="font-label text-[11px] uppercase tracking-[0.14em] text-on-surface-variant hover:text-gold-dark">Catalog</a>
        <a href="index.html#systems" class="font-label text-[11px] uppercase tracking-[0.14em] text-on-surface-variant hover:text-gold-dark">8 Systems</a>
      </nav>

      <a href="catalog.html" class="bg-ink text-gold-light border border-gold/50 hover:bg-gold hover:text-white font-label text-[10px] uppercase tracking-[0.15em] px-3.5 py-2 transition-colors">
        Full Catalog
      </a>
    </div>
  </header>

  <main class="max-w-fhd mx-auto px-4 sm:px-6 py-7 sm:py-9">
    <!-- Compact Brand Banner -->
    <div class="relative w-full h-[220px] sm:h-[280px] bg-surface-container border border-hairline overflow-hidden mb-6">
      <img id="brand-banner" class="w-full h-full object-cover" src="" alt="Brand Banner"/>
      <div class="absolute inset-0 bg-gradient-to-r from-white/90 via-white/60 to-transparent"></div>
      <div class="absolute inset-0 flex items-center px-6 sm:px-10">
        <div class="bg-white/92 backdrop-blur-sm p-4 sm:p-6 max-w-lg border-l-[3px] border-gold shadow-sm">
          <span class="font-label text-[10px] uppercase tracking-[0.22em] text-gold-dark font-semibold" id="brand-country">Origin</span>
          <h1 class="font-headline text-xl sm:text-3xl uppercase text-ink tracking-tight mt-0.5 font-medium" id="brand-name">Partner Brand</h1>
          <p class="text-xs text-on-surface-variant mt-2 leading-relaxed" id="brand-bio"></p>
        </div>
      </div>
    </div>

    <div class="border-t border-hairline pt-6 mb-5 flex items-baseline justify-between">
      <h2 class="font-headline text-base sm:text-lg uppercase text-ink font-medium">Models by This Brand</h2>
      <span class="font-label text-[11px] uppercase text-secondary" id="brand-doors-count">0 models</span>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4" id="brand-doors-grid"></div>
  </main>

  <footer class="w-full bg-surface-low border-t border-hairline py-6 mt-10">
    <div class="max-w-fhd mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-2 font-label text-[10px] text-secondary uppercase tracking-wider">
      <span>© 2026 DOORS GALLERY. ALL RIGHTS RESERVED.</span>
      <a href="index.html" class="text-gold-dark hover:underline">← Back to Showroom Home</a>
    </div>
  </footer>

  <script type="module">
    import { store } from '../shared/js/store.js';
    import { Utils } from '../shared/js/utils.js';

    document.addEventListener('DOMContentLoaded', () => {
      const settings = store.getSettings();
      if (settings.logoUrl) document.getElementById('header-logo-img').src = settings.logoUrl;
      if (settings.companyName) document.getElementById('header-brand-title').textContent = settings.companyName;

      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');
      const brands = store.getBrands();
      const brand = brands.find(b => b.slug === slug) || brands[0];

      if (!brand) {
        document.getElementById('brand-name').textContent = 'Brand Not Found';
        return;
      }

      document.getElementById('brand-name').textContent = brand.name;
      document.getElementById('brand-country').textContent = `Origin / ${brand.originCountry}`;
      document.getElementById('brand-bio').textContent = brand.bio || 'Precision architectural door engineering.';
      document.getElementById('brand-banner').src = brand.heroBanner || 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=80';

      const doors = store.getDoors({ isActive: true }).filter(d => d.brandId === brand.id);
      document.getElementById('brand-doors-count').textContent = `${doors.length} model(s)`;

      const grid = document.getElementById('brand-doors-grid');
      if (doors.length === 0) {
        grid.innerHTML = '<div class="col-span-full p-8 text-secondary font-label text-xs uppercase bg-surface-low border border-hairline">No active doors listed under this brand.</div>';
        return;
      }

      grid.innerHTML = doors.map(door => {
        const priceInfo = store.calculateEffectivePrice(door);
        const primaryImg = (door.images || []).find(i => i.isPrimary)?.url || door.images?.[0]?.url || Utils.getArchitecturalPlaceholderSvg();

        return `
          <article class="bg-white border border-hairline hover:border-gold/70 transition-all flex flex-col shadow-xs">
            <div class="aspect-[4/4.5] overflow-hidden bg-surface-container">
              <img src="${primaryImg}" class="w-full h-full object-cover" alt="${Utils.escapeHtml(door.name)}"/>
            </div>
            <div class="p-3.5 flex flex-col justify-between flex-grow">
              <div>
                <span class="font-label text-[10px] text-secondary uppercase">${Utils.escapeHtml(door.sku)}</span>
                <h3 class="font-headline text-sm font-medium uppercase text-ink mt-0.5">${Utils.escapeHtml(door.name)}</h3>
                <p class="text-[11px] text-on-surface-variant mt-1 line-clamp-2">${Utils.escapeHtml(door.shortDescription || '')}</p>
              </div>
              <div class="mt-3 pt-2.5 border-t border-hairline flex items-center justify-between">
                <span class="font-headline text-sm font-semibold text-gold-dark">${Utils.formatCurrency(priceInfo.effectivePrice)}</span>
                <a href="catalog.html?brand=${encodeURIComponent(brand.slug)}" class="border border-gold bg-white text-ink hover:bg-ink hover:text-gold-light font-label text-[10px] uppercase tracking-wider px-2.5 py-1.5 transition-colors">
                  Explore
                </a>
              </div>
            </div>
          </article>
        `;
      }).join('');
    });
  </script>
</body>
</html>
